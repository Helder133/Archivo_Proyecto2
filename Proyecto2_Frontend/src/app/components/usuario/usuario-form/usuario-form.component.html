<div class="card shadow-sm border-secondary">
    <div class="card-header bg-dark text-white border-secondary">
        <h5 class="mb-0">
            <i class="bi" [class.bi-person-plus]="!usuarioAEditar" [class.bi-pencil-square]="usuarioAEditar"></i>
            {{ usuarioAEditar ? 'Editar Usuario' : 'Crear Nuevo Usuario' }}
        </h5>
    </div>

    @if (backendError) {
        <div class="alert alert-danger m-3 d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <div>{{ backendError }}</div>
        </div>
    }

    <div class="card-body bg-dark text-light">
        <form [formGroup]="usuarioForm" (ngSubmit)="onSubmit()">

            <div class="mb-3">
                <label class="form-label">Nombre Completo</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" formControlName="nombre"
                    [class.is-invalid]="usuarioForm.get('nombre')?.invalid && usuarioForm.get('nombre')?.touched">
            </div>

            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control bg-dark text-light border-secondary" formControlName="email"
                    [class.is-invalid]="usuarioForm.get('email')?.invalid && usuarioForm.get('email')?.touched">
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña {{ usuarioAEditar ? '(Opcional)' : '' }}</label>
                <input type="password" class="form-control bg-dark text-light border-secondary"
                    formControlName="password"
                    [class.is-invalid]="usuarioForm.get('password')?.invalid && usuarioForm.get('password')?.touched">
            </div>

            <div class="mb-4">
                <label class="form-label">Rol del Sistema</label>
                <select class="form-select bg-dark text-light border-secondary" formControlName="rol">
                    <option value="usuario">Usuario Estándar</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">Cancelar</button>
                <button type="submit" class="btn btn-primary">
                    {{ usuarioAEditar ? 'Actualizar Datos' : 'Guardar Usuario' }}
                </button>
            </div>

        </form>
    </div>
</div>
