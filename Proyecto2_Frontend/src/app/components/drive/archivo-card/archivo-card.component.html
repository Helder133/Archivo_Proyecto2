<div class="card bg-dark text-light border-secondary shadow-sm user-select-none">
    <div class="card-body d-flex align-items-center p-3">

        <!-- Ícono dinámico según la extensión -->
        <i class="bi fs-3 me-3" [class.bi-filetype-txt]="archivo.tipo === '.txt'"
            [class.bi-filetype-md]="archivo.tipo === '.md'" [class.text-info]="archivo.tipo === '.txt'"
            [class.text-primary]="archivo.tipo === '.md'">
        </i>

        <!-- Información -->
        <div class="flex-grow-1 text-truncate">
            <h6 class="mb-0 text-truncate" [title]="archivo.nombre">{{ archivo.nombre }}{{ archivo.tipo }}</h6>
            <small class="text-secondary">{{ archivo.fechaCreacion | date:'dd/MM/yyyy' }}</small>
        </div>

        <!-- Acciones directas -->
        <div class="d-flex gap-1">
            <button class="btn btn-sm btn-link text-success" (click)="onDescargar()" title="Descargar">
                <i class="bi bi-cloud-arrow-down-fill"></i>
            </button>
            <button class="btn btn-sm btn-link text-secondary" (click)="opciones.emit(archivo)" title="Opciones">
                <i class="bi bi-three-dots-vertical"></i>
            </button>
        </div>

    </div>
</div>
