<!-- Borde dinámico igual que la carpeta -->
<div class="card bg-dark text-light shadow-sm user-select-none" [class.border-info]="esCompartidoConmigo"
    [class.border-secondary]="!esCompartidoConmigo">

    <div class="card-body d-flex align-items-center p-3">

        <!-- Ícono extensión (se mantiene su color original para no confundir el tipo de archivo) -->
        <i class="bi fs-3 me-3" [class.bi-filetype-txt]="archivo.tipo === '.txt'"
            [class.bi-filetype-md]="archivo.tipo === '.md'" [class.text-info]="archivo.tipo === '.txt'"
            [class.text-primary]="archivo.tipo === '.md'">
        </i>

        <!-- Información -->
        <div class="flex-grow-1 text-truncate">
            <h6 class="mb-0 text-truncate d-flex align-items-center" [title]="archivo.nombre">
                <span class="text-truncate">{{ archivo.nombre }}{{ archivo.tipo }}</span>
                <!-- Etiqueta brillante -->
                @if (esCompartidoConmigo) {
                <span class="badge bg-info text-dark ms-2 fw-bold" style="font-size: 0.65rem;">Compartido</span>
                }
            </h6>
            <small class="text-secondary">{{ archivo.fechaCreacion | date:'dd/MM/yyyy' }}</small>
        </div>

        <!-- Acciones directas -->
        <div class="d-flex gap-1">
            <button class="btn btn-sm btn-link text-success" (click)="onDescargar()" title="Descargar">
                <i class="bi bi-cloud-arrow-down-fill"></i>
            </button>

            @if (puedeEditar) {
            <button class="btn btn-sm btn-link text-primary" (click)="editarContenido.emit(archivo)"
                title="Actualizar contenido">
                <i class="bi bi-file-earmark-arrow-up-fill"></i>
            </button>
            <button class="btn btn-sm btn-link text-info" (click)="editarMetadata.emit(archivo)"
                title="Renombrar archivo">
                <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-link text-warning" (click)="compartir.emit(archivo)" title="Compartir">
                <i class="bi bi-person-plus-fill"></i>
            </button>
            <button class="btn btn-sm btn-link text-danger" (click)="eliminar.emit(archivo._id)"
                title="Mover a papelera">
                <i class="bi bi-trash"></i>
            </button>
            }
        </div>  

    </div>
</div>
