<!-- Cambiamos el borde dinámicamente -->
<div class="card bg-dark text-light shadow-sm user-select-none" [class.border-info]="esCompartidoConmigo"
    [class.border-secondary]="!esCompartidoConmigo" style="cursor: pointer;" (dblclick)="onDblClick()">

    <div class="card-body d-flex align-items-center p-3">

        <!-- El ícono principal cambia de color y forma si es compartido -->
        <i class="bi fs-3 me-3" [class.bi-folder-fill]="!esCompartidoConmigo"
            [class.bi-folder-symlink-fill]="esCompartidoConmigo" [class.text-warning]="!esCompartidoConmigo"
            [class.text-info]="esCompartidoConmigo" [title]="esCompartidoConmigo ? 'Carpeta compartida' : 'Tu carpeta'">
        </i>

        <!-- Info -->
        <div class="flex-grow-1 text-truncate">
            <h6 class="mb-0 text-truncate d-flex align-items-center" [title]="carpeta.nombre">
                <span class="text-truncate">{{ carpeta.nombre }}</span>
                <!-- Etiqueta brillante y explícita -->
                @if (esCompartidoConmigo) {
                <span class="badge bg-info text-dark ms-2 fw-bold" style="font-size: 0.65rem;">Compartido</span>
                }
            </h6>
            <small class="text-secondary">{{ carpeta.fechaCreacion | date:'dd/MM/yyyy' }}</small>
        </div>

        <div class="d-flex gap-1">
            @if (puedeEditar) {
            <button class="btn btn-sm btn-link text-info" (click)="$event.stopPropagation(); editar.emit(carpeta)"
                title="Renombrar">
                <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-link text-warning" (click)="$event.stopPropagation(); compartir.emit(carpeta)"
                title="Compartir">
                <i class="bi bi-person-plus-fill"></i>
            </button>
            }
            @if(!esCompartidoConmigo) {
            <button class="btn btn-sm btn-link text-danger"
                (click)="$event.stopPropagation(); eliminar.emit(carpeta._id)" title="Mover a papelera">
                <i class="bi bi-trash"></i>
            </button>
            }
        </div>
    </div>
</div>
