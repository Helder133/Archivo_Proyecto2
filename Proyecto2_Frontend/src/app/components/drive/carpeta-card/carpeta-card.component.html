<div class="card bg-dark text-light border-secondary shadow-sm user-select-none" style="cursor: pointer;"
    (dblclick)="onDblClick()">
    <div class="card-body d-flex align-items-center p-3">
        <!-- Icono de carpeta -->
        <i class="bi bi-folder-fill fs-3 text-warning me-3"></i>

        <!-- Info -->
        <div class="flex-grow-1 text-truncate">
            <h6 class="mb-0 text-truncate" [title]="carpeta.nombre">{{ carpeta.nombre }}</h6>
            <small class="text-secondary">{{ carpeta.fechaCreacion | date:'dd/MM/yyyy' }}</small>
        </div>

        <!-- Botón de opciones -->
        <button class="btn btn-sm btn-link text-secondary" (click)="$event.stopPropagation(); opciones.emit(carpeta)">
            <i class="bi bi-three-dots-vertical"></i>
        </button>
    </div>
</div>
