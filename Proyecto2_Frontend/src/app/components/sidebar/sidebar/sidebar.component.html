<div class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark border-end border-secondary vh-100"
    style="width: 280px;">
    <a routerLink="/dashboard"
        class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
        <i class="bi bi-hdd-network fs-3 me-2 text-primary"></i>
        <span class="fs-4 fw-bold">Mini Drive</span>
    </a>
    <hr class="border-secondary">

    <ul class="nav nav-pills flex-column mb-auto">

        <!-- ========================================== -->
        <!-- OPCIONES EXCLUSIVAS DEL ADMINISTRADOR      -->
        <!-- ========================================== -->
        @if (usuarioActual()?.rol === 'admin') {
        <li class="nav-item mb-2">
            <a routerLink="/admin/usuarios" routerLinkActive="active"
                class="nav-link text-white d-flex align-items-center">
                <i class="bi bi-people me-3 fs-5"></i>
                Gestión de Usuarios
            </a>
        </li>
        <li class="nav-item mb-2">
            <a routerLink="/admin/reportes" routerLinkActive="active"
                class="nav-link text-white d-flex align-items-center">
                <i class="bi bi-bar-chart-line me-3 fs-5"></i>
                Reportes del Sistema
            </a>
        </li>
        <li class="nav-item mb-2">
            <a routerLink="/admin/bitacora" routerLinkActive="active"
                class="nav-link text-white d-flex align-items-center">
                <i class="bi bi-journal-text me-3 fs-5"></i>
                Bitácora (Auditoría)
            </a>
        </li>
        }

        <!-- ========================================== -->
        <!-- OPCIONES EXCLUSIVAS DEL USUARIO ESTÁNDAR   -->
        <!-- ========================================== -->
        @if (usuarioActual()?.rol === 'usuario') {
        <li class="nav-item mb-2">
            <a routerLink="/mi-unidad" routerLinkActive="active"
                class="nav-link text-white d-flex align-items-center">
                <i class="bi bi-folder2-open me-3 fs-5"></i>
                Mi Unidad
            </a>
        </li>
        <li class="nav-item mb-2">
            <a routerLink="/compartidos" routerLinkActive="active"
                class="nav-link text-white d-flex align-items-center">
                <i class="bi bi-people-fill me-3 fs-5"></i>
                Compartidos conmigo
            </a>
        </li>
        <li class="nav-item mb-2">
            <a routerLink="/papelera" routerLinkActive="active"
                class="nav-link text-white d-flex align-items-center">
                <i class="bi bi-trash3 me-3 fs-5"></i>
                Papelera
            </a>
        </li>
        }
    </ul>

    <hr class="border-secondary">

    <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1"
            data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle fs-4 me-2"></i>
            <strong>{{ usuarioActual()?.nombre || 'Perfil' }}</strong>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
            <li><a class="dropdown-item" href="#">Configuración</a></li>
            <li>
                <hr class="dropdown-divider border-secondary">
            </li>
            <li><button class="dropdown-item text-danger" (click)="cerrarSesion()">Cerrar sesión</button></li>
        </ul>
    </div>
</div>
