<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">

        <div class="text-center mb-4">
            <i class="bi bi-hdd-network text-primary" style="font-size: 3rem;"></i>
            <h2 class="fw-bold mt-2">Mini Drive</h2>
            <p class="text-secondary">Inicia sesión en tu cuenta</p>
        </div>

        @if (errorMessage()) {
        <div class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <div>{{ errorMessage() }}</div>
        </div>
        }

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" formControlName="email" class="form-control"
                        placeholder="admin@cunoc.edu.gt"
                        [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                </div>
                @if (loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched) {
                <div class="text-danger small mt-1">El correo es obligatorio.</div>
                }
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" formControlName="password" class="form-control"
                        placeholder="••••••••"
                        [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold" [disabled]="loginForm.invalid || isLoading()">
                @if (isLoading()) {
                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                Ingresando...
                } @else {
                <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
                }
            </button>

        </form>
    </div>
</div>
